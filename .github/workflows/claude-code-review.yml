name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft && !startsWith(github.head_ref, 'agent/submission-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for concrete, actionable issues. Focus on:
            - bugs and behavioral regressions
            - security and privacy risks
            - data-schema or generated-data mismatches
            - missing tests for changed behavior

            The pull request branch is already checked out. Do not edit files,
            commit, push, deploy, or trigger workflows. Only post GitHub comments.
            Use inline comments for specific issues and one concise top-level
            summary. If there are no findings, say so briefly.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      - name: Summarize Claude failure
        if: ${{ failure() && steps.claude-review.outcome == 'failure' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const candidates = [
            process.env.EXECUTION_FILE,
            path.join(process.env.RUNNER_TEMP, 'claude-execution-output.json'),
          ].filter(Boolean);

          const file = candidates.find(candidate => fs.existsSync(candidate));

          if (!file) {
            console.log('Claude diagnostic file was not available.');
            process.exit(0);
          }

          let events;
          try {
            events = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch {
            console.log('Claude diagnostic file could not be parsed.');
            process.exit(0);
          }

          if (!Array.isArray(events)) {
            console.log('Claude diagnostic file has an unexpected format.');
            process.exit(0);
          }

          const results = events.filter(event => event?.type === 'result');
          const result = results.at(-1);

          if (!result) {
            console.log('No Claude result event was found.');
            process.exit(0);
          }

          const codes = new Set();

          for (const value of [
            result.api_error_status,
            result.error_status,
            result.error?.status,
          ]) {
            const code = Number(value);
            if (Number.isInteger(code) && code >= 400 && code <= 599) {
              codes.add(code);
            }
          }

          if (typeof result.result === 'string') {
            const match = result.result.match(
              /(?:API Error|HTTP|status(?: code)?)\s*[:=]?\s*(\d{3})/i
            );
            if (match) {
              const code = Number(match[1]);
              if (code >= 400 && code <= 599) codes.add(code);
            }
          }

          console.log('Claude reported an error:', result.is_error === true);

          if (codes.size) {
            console.log('Possible HTTP status:', [...codes].join(', '));
          } else {
            console.log('No HTTP status was found in the result.');
          }
          NODE